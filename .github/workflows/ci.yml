name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-test:
    name: Build + test (gcc)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y libldap2-dev libjson-c-dev
      - run: make clean && make
      - run: make test
      - name: ASan/UBSan build
        run: make clean && make CFLAGS='-Wall -Wextra -pedantic -O1 -g -fsanitize=address,undefined -fno-omit-frame-pointer -Isrc -Iinclude -I/usr/include' LDFLAGS='-fsanitize=address,undefined -lldap -llber -ljson-c'
